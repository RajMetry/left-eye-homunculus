<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">LEFT EYE — Somatic Body Metaphor Visualizer</title>
  <desc id="desc">A split clinical-white and manga-black visual with an abstract human silhouette and red/cyan anatomical signal rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070709"/><stop offset="0.56" stop-color="#11111a"/><stop offset="1" stop-color="#1e1018"/></linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc" stop-opacity="0.98"/><stop offset="0.48" stop-color="#f8fafc" stop-opacity="0.98"/><stop offset="0.481" stop-color="#08080b" stop-opacity="0.9"/><stop offset="1" stop-color="#08080b" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.48" stop-color="#64748b"/><stop offset="1" stop-color="#242430"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fb7185" opacity=".19"/></pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".12" stroke-width="1"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <path d="M0 0H780V560H0Z" fill="#f8fafc"/>
  <path d="M800 0H1600V560H800Z" fill="#08080c"/>
  <path d="M0 0H780V560H0Z" fill="url(#grid)" opacity=".55"/>
  <path d="M800 0H1600V560H800Z" fill="url(#dots)" opacity=".9"/>
  <rect x="0" y="0" width="1600" height="560" rx="28" fill="none" stroke="#64748b" stroke-opacity=".38" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="86" y="92" font-size="17" letter-spacing="5" font-weight="700" fill="#0284c7">RIGHT EYE / OBSERVE</text>
    <text x="86" y="176" font-size="73" font-weight="900" letter-spacing="-3" fill="#0f172a">LEFT EYE</text>
    <text x="88" y="222" font-size="21" font-weight="700" letter-spacing="2.5" fill="#334155">SOMATIC HOMUNCULUS ENGINE</text>
    <rect x="88" y="258" width="440" height="2" fill="#cbd5e1"/>
    <text x="88" y="302" font-size="21" fill="#334155">Turn body metaphors into an</text>
    <text x="88" y="332" font-size="21" fill="#334155">interactive, symbolic 3D experience.</text>
    <rect x="88" y="383" width="234" height="44" rx="12" fill="#0284c7" fill-opacity=".1" stroke="#0284c7" stroke-opacity=".4"/>
    <text x="106" y="411" font-size="14" font-weight="700" letter-spacing="1.3" fill="#0369a1">LOCAL-FIRST PROTOTYPE</text>
    <text x="88" y="493" font-size="13" letter-spacing="2.6" fill="#64748b">ART × INTERACTION × REFLECTION</text>
    <text x="878" y="92" font-size="17" letter-spacing="5" font-weight="700" fill="#fb7185">LEFT EYE / INTERPRET</text>
    <text x="878" y="148" font-size="23" font-weight="800" fill="#f8fafc">Feelings become form.</text>
    <text x="878" y="184" font-size="16" fill="#a1a1aa">Not a diagnosis. Not a medical device.</text>
  </g>
  <!-- Abstract, intentionally non-anatomical 3D figure -->
  <g transform="translate(1198 310)">
    <ellipse cx="0" cy="194" rx="132" ry="20" fill="#e11d48" opacity=".16" filter="url(#glow)"/>
    <ellipse cx="0" cy="190" rx="105" ry="13" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M-53 -87 C-81 -100 -103 -65 -104 -28 L-113 39 C-116 57 -102 69 -89 54 L-65 -14 L-54 4 L-63 82 C-64 102 -44 111 -31 94 L-18 23 L18 23 L31 94 C44 111 64 102 63 82 L54 4 L65 -14 L89 54 C102 69 116 57 113 39 L104 -28 C103 -65 81 -100 53 -87 C34 -73 22 -70 0 -70 C-22 -70 -34 -73 -53 -87Z" fill="url(#figure)" stroke="#cbd5e1" stroke-opacity=".48" stroke-width="2"/>
    <path d="M-30 -95 C-33 -116 -25 -137 0 -139 C25 -137 33 -116 30 -95 C26 -73 17 -64 0 -64 C-17 -64 -26 -73 -30 -95Z" fill="url(#figure)" stroke="#e2e8f0" stroke-opacity=".7" stroke-width="2"/>
    <path d="M-50 -73 Q0 -94 50 -73 M-31 -16 Q0 -29 31 -16 M-18 26 Q0 38 18 26" fill="none" stroke="#94a3b8" stroke-opacity=".55" stroke-width="2"/>
    <ellipse cx="0" cy="-32" rx="47" ry="39" fill="none" stroke="url(#red)" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="0" cy="-32" rx="64" ry="54" fill="none" stroke="#f43f5e" stroke-opacity=".42" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="0" cy="-32" r="8" fill="#fb7185" filter="url(#glow)"/>
    <ellipse cx="-91" cy="45" rx="22" ry="31" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".85"/>
    <ellipse cx="85" cy="48" rx="22" ry="31" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".6"/>
    <path d="M-142 -32H-108 M108 -32H143 M0 -167V-151 M-145 124L-116 104 M146 123L116 104" stroke="#fb7185" stroke-width="1.6" stroke-opacity=".8"/>
    <circle cx="-145" cy="-32" r="3" fill="#fb7185"/><circle cx="143" cy="-32" r="3" fill="#fb7185"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#71717a" letter-spacing="1.8">
    <text x="1430" y="500">VOL. 01 / EXPLORATORY</text>
    <text x="1430" y="520" fill="#fb7185">LOCAL MAPPING</text>
  </g>
</svg>
